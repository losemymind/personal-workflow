name: validate-skill-agent

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml pytest

      - name: Validate skills (strict)
        run: python skill-creator/scripts/validate_skills.py --strict --dir skills

      - name: Validate agent-creator methodology dir (own docs must not be scanned as agents)
        run: python agent-creator/scripts/validate_agents.py --strict --dir agents

      - name: Run tests
        run: python -m pytest tests/ -q